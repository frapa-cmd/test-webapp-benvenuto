<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Benvenuto | Test webapp</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #f8fafc; background: radial-gradient(circle at 20% 20%, #1e3a5f, transparent 40%), linear-gradient(135deg, #0b1020, #17253d); }
    main { width: min(100%, 560px); padding: clamp(28px, 7vw, 56px); border: 1px solid #ffffff30; border-radius: 24px; background: #ffffff0d; box-shadow: 0 24px 70px #0004; text-align: center; }
    .badge { display: inline-block; padding: 8px 14px; border: 1px solid #8ee7bc70; border-radius: 999px; color: #8ee7bc; font-size: 14px; }
    h1 { margin: 24px 0 12px; font-size: clamp(36px, 8vw, 56px); letter-spacing: -0.04em; }
    p { margin: 0; line-height: 1.65; color: #cbd5e1; }
    .note { margin-top: 30px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Test di pubblicazione</span>
    <h1>Benvenuto!</h1>
    <p>La tua prima web app è online. Il collegamento tra GitHub e Vercel funziona.</p>
    <p class="note">Una semplice pagina di prova, pronta a diventare qualcosa di più.</p>
  </main>
</body>
</html>
